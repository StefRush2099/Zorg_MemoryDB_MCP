name: Publish Python Package
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish to GitHub Packages
        run: |
          pip install twine
          TWINE_USERNAME=__token__ \
          TWINE_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
          twine upload --repository-url https://upload.pypi.org/legacy/ dist/*
        env:
          TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
      - name: Publish to GitHub Packages (correct URL)
        run: |
          pip install twine
          TWINE_USERNAME=__token__ \
          TWINE_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
          twine upload --repository-url https://python.pkg.github.com/StefRush2099 dist/*
        continue-on-error: true
      - name: Show install instructions
        run: |
          echo "=== Install from GitHub Packages ==="
          echo "Configure .pypirc or use: pip install --index-url https://python.pkg.github.com/StefRush2099 zorg-memorydb-mcp"
          echo "GitHub token required for auth."
