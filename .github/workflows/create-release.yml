name: Create Release
on:
  workflow_dispatch:
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/tags \
            -f tag=v1.0.0 \
            -f tagger.name=StefRush2099 \
            -f tagger.email=stefrush2099@gmail.com \
            -f tagger.date="2026-10-04T14:30:00Z" \
            -f message="Zorg MemoryDB MCP v1.0.0" \
            -f object=67e666c7646e986f77c2ab56209ee9ef98b2d457 \
            -f type=commit
          gh api repos/${{ github.repository }}/git/refs \
            -f ref=refs/tags/v1.0.0 \
            -f sha=$(gh api repos/${{ github.repository }}/git/refs/tags/v1.0.0 --jq .object.sha 2>/dev/null || echo "")
          gh release create v1.0.0 \
            --title "Zorg MemoryDB MCP v1.0.0" \
            --notes "First public release. PostgreSQL-backed durable memory + operating-rule system for LLM assistants."
