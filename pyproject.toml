[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zorg-memorydb-mcp"
version = "1.0.1"
description = "PostgreSQL-backed durable memory and operating-rule system for LLM assistants, exposed as an MCP service"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "StefRush2099"}]
keywords = ["mcp", "memory", "postgresql", "pgvector", "llm", "context", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
zorg_memorydb_mcp = ["*.sql"]
